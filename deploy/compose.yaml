name: portfolio

networks:
  proxy-network:
    external: true
  internal:
    internal: true

volumes:
  pgdata:

services:
  # ================= FRONTEND =================
  frontend:
    build:
      context: ../portfoliofront
      dockerfile: Dockerfile
    image: gabus/portfolio-front:latest
    container_name: portfolio_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-network
      - traefik.http.routers.portfolio-frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.portfolio-frontend.entrypoints=web
      - traefik.http.services.portfolio-frontend.loadbalancer.server.port=80

  # ================= BACKEND =================
  backend:
    build:
      context: ../portafolioback
      dockerfile: Dockerfile
    image: gabus/portfolio-api:latest
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-portfolio_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-portfolio_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this}
      DOMAIN: ${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proxy-network
      - internal

  # ================= BASE DE DATOS =================
  db:
    image: postgres:17-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
